name: Deploy to EKS

on:
  push:
    branches:
      - main

  repository_dispatch:
    types: [deploy-eks]

  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy'
        required: false
        default: 'latest'

permissions:
  contents: read

# ---------------------------------------------------------
# EVITA DOIS PIPELINES DE INFRA RODANDO AO MESMO TEMPO
# ---------------------------------------------------------
concurrency:
  group: terraform-eks-state
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: main
  NAMESPACE: postech
  APP_IMAGE: ghcr.io/edunsantos/tech-challenge-application

# =========================================================
# TERRAFORM
# =========================================================
jobs:

  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.5

      - name: Terraform Init
        run: |
          terraform init \
            -input=false \
            -reconfigure \
            -lock-timeout=5m

      - name: Terraform Apply
        env:
          TF_VAR_aws_region: ${{ env.AWS_REGION }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
        run: |
          terraform apply \
            -auto-approve \
            -input=false \
            -lock-timeout=5m


  # =======================================================
  # IMAGE TAG
  # =======================================================
  image:
    name: Define Image Tag
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.image.outputs.tag }}

    steps:

      - name: Set image tag
        id: image
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ github.event.client_payload.tag }}
          INPUT_TAG: ${{ github.event.inputs.image_tag }}
        run: |
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            TAG="${DISPATCH_TAG:-latest}"
          else
            TAG="${INPUT_TAG:-latest}"
          fi

          echo "Deploying image tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"


  # =======================================================
  # EKS
  # =======================================================
  eks:
    name: Configure EKS
    runs-on: ubuntu-latest
    needs: terraform

    steps:

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION"

      - name: Check cluster
        run: |
          kubectl cluster-info
          kubectl get nodes


  # =======================================================
  # CONFIGMAP / NAMESPACE
  # =======================================================
  config:
    name: Apply Kubernetes Config
    runs-on: ubuntu-latest
    needs: eks

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION"

      - name: Apply namespace
        run: |
          kubectl apply -f k8s/00-namespaces/

      - name: Apply ConfigMap
        run: |
          kubectl apply -f k8s/01-config/configmap.yaml


  # =======================================================
  # SECRETS
  # =======================================================
  secrets:
    name: Apply Kubernetes Secrets
    runs-on: ubuntu-latest
    needs: config

    steps:

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION"

      # ---------------------------------------------------
      # GHCR
      # ---------------------------------------------------
      - name: Create GHCR pull secret
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_EMAIL: ${{ secrets.GHCR_EMAIL }}
        run: |
          kubectl create secret docker-registry ghcr-secret \
            --docker-server=ghcr.io \
            --docker-username="$GHCR_USERNAME" \
            --docker-password="$GHCR_TOKEN" \
            --docker-email="$GHCR_EMAIL" \
            --namespace "$NAMESPACE" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      # ---------------------------------------------------
      # APPLICATION
      # ---------------------------------------------------
      - name: Create application secret
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
          NEW_RELIC_KEY: ${{ secrets.NEW_RELIC_KEY }}
          NEW_RELIC_API_KEY: ${{ secrets.NEW_RELIC_API_KEY }}
          NEW_RELIC_ACCOUNT_ID: ${{ secrets.NEW_RELIC_ACCOUNT_ID }}
        run: |
          kubectl create secret generic app-secrets \
            --namespace "$NAMESPACE" \
            --from-literal=APP_KEY="$APP_KEY" \
            --from-literal=DB_PASSWORD="$DB_PASSWORD" \
            --from-literal=JWT_SECRET="$JWT_SECRET" \
            --from-literal=MAIL_USERNAME="$MAIL_USERNAME" \
            --from-literal=MAIL_PASSWORD="$MAIL_PASSWORD" \
            --from-literal=NEW_RELIC_LICENSE_KEY="$NEW_RELIC_LICENSE_KEY" \
            --from-literal=NEW_RELIC_ENABLED="true" \
            --from-literal=NEW_RELIC_KEY="$NEW_RELIC_KEY" \
            --from-literal=NEW_RELIC_API_KEY="$NEW_RELIC_API_KEY" \
            --from-literal=NEW_RELIC_ACCOUNT_ID="$NEW_RELIC_ACCOUNT_ID" \
            --dry-run=client \
            -o yaml | kubectl apply -f -


  # =======================================================
  # DATABASE MIGRATION
  # =======================================================
  migration:
    name: Database Migration
    runs-on: ubuntu-latest
    needs:
      - secrets
      - image

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION"

      - name: Install yq
        uses: mikefarah/yq@v4

      - name: Run database migration
        env:
          IMAGE_TAG: ${{ needs.image.outputs.tag }}
        run: |

          echo "Running migration:"
          echo "${APP_IMAGE}:${IMAGE_TAG}"

          kubectl delete job app-migrate \
            -n "$NAMESPACE" \
            --ignore-not-found

          yq eval \
            '.spec.template.spec.containers[0].image = env(APP_IMAGE) + ":" + env(IMAGE_TAG)' \
            k8s/02-app/migrate-job.yaml \
            > /tmp/migrate-job.yaml

          kubectl apply -f /tmp/migrate-job.yaml

          echo "Waiting for migration..."

          if ! kubectl wait \
            --for=condition=complete \
            job/app-migrate \
            -n "$NAMESPACE" \
            --timeout=180s; then

            echo "Migration failed."

            kubectl describe job app-migrate \
              -n "$NAMESPACE" || true

            echo "Migration logs:"

            kubectl logs \
              job/app-migrate \
              -n "$NAMESPACE" \
              --tail=200 || true

            exit 1
          fi

          echo "Migration completed successfully."

          kubectl logs \
            job/app-migrate \
            -n "$NAMESPACE" \
            --tail=200


  # =======================================================
  # APPLICATION
  # =======================================================
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    needs:
      - migration
      - image

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION"

      - name: Install yq
        uses: mikefarah/yq@v4

      - name: Apply remaining application manifests
        run: |
          find k8s/02-app \
            -type f \
            ! -name "deployment.yaml" \
            -exec kubectl apply -f {} \;


  # =======================================================
  # NEW RELIC
  # =======================================================
  newrelic:
    name: Deploy New Relic
    runs-on: ubuntu-latest
    needs: eks

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION"

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Deploy New Relic Kubernetes integration
        run: |
          set -euo pipefail

          helm repo add newrelic \
            https://helm-charts.newrelic.com || true

          helm repo update

          helm upgrade --install newrelic-bundle \
            newrelic/nri-bundle \
            --namespace "$NAMESPACE" \
            --create-namespace \
            -f newrelic-values.yaml


  # =======================================================
  # ROLLOUT
  # =======================================================
  rollout:
    name: Rollout Application
    runs-on: ubuntu-latest
    needs:
      - deploy
      - newrelic

    steps:

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION"

      - name: Restart deployment
        run: |
          kubectl rollout restart \
            deployment/postech-app \
            -n "$NAMESPACE"

      - name: Rollout status
        run: |
          kubectl rollout status \
            deployment/postech-app \
            -n "$NAMESPACE" \
            --timeout=180s

      - name: Show pods
        run: |
          kubectl get pods \
            -n "$NAMESPACE" \
            -o wide

      - name: Show deployment image
        run: |
          kubectl get deployment postech-app \
            -n "$NAMESPACE" \
            -o jsonpath='{.spec.template.spec.containers[*].image'

          echo