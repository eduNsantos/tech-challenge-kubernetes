name: Deploy to EKS

on:
  push:
    branches:
      - main

  repository_dispatch:
    types: [deploy-eks]

  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy'
        required: false
        default: 'latest'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: us-east-1
      EKS_CLUSTER_NAME: main
      NAMESPACE: postech
      APP_IMAGE: ghcr.io/edunsantos/tech-challenge-application

    steps:
      # ---------------------------------------------------------
      # CHECKOUT
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # AWS
      # ---------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ---------------------------------------------------------
      # TERRAFORM
      # ---------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.5

      - name: Terraform Init
        run: |
          terraform init -input=false

      - name: Terraform Apply
        working-directory: terraform
        env:
          TF_VAR_aws_region: ${{ env.AWS_REGION }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
        run: |
          terraform apply \
            -auto-approve \
            -input=false

      # ---------------------------------------------------------
      # IMAGE TAG
      # ---------------------------------------------------------
      - name: Set image tag
        id: image
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ github.event.client_payload.tag }}
          INPUT_TAG: ${{ github.event.inputs.image_tag }}
        run: |
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            TAG="${DISPATCH_TAG:-latest}"
          else
            TAG="${INPUT_TAG:-latest}"
          fi

          echo "Deploying image tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------
      # EKS
      # ---------------------------------------------------------
      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION"

      # ---------------------------------------------------------
      # NAMESPACE + CONFIGMAP
      # ---------------------------------------------------------
      - name: Apply non-secret Kubernetes config
        run: |
          kubectl apply -f k8s/00-namespaces/
          kubectl apply -f k8s/01-config/configmap.yaml

      # ---------------------------------------------------------
      # GHCR SECRET
      # ---------------------------------------------------------
      - name: Create GHCR pull secret
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_EMAIL: ${{ secrets.GHCR_EMAIL }}
        run: |
          kubectl delete secret ghcr-secret \
            -n "$NAMESPACE" \
            --ignore-not-found

          kubectl create secret docker-registry ghcr-secret \
            --docker-server=ghcr.io \
            --docker-username="$GHCR_USERNAME" \
            --docker-password="$GHCR_TOKEN" \
            --docker-email="$GHCR_EMAIL" \
            --namespace "$NAMESPACE" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      # ---------------------------------------------------------
      # APPLICATION SECRETS
      # ---------------------------------------------------------
      - name: Create application secret
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          NEW_RELIC_ENABLED: ${{ secrets.NEW_RELIC_ENABLED }}
          NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
          NEW_RELIC_KEY: ${{ secrets.NEW_RELIC_KEY }}
          NEW_RELIC_API_KEY: ${{ secrets.NEW_RELIC_API_KEY }}
          NEW_RELIC_ACCOUNT_ID: ${{ secrets.NEW_RELIC_ACCOUNT_ID }}
        run: |
          kubectl delete secret app-secrets \
            -n "$NAMESPACE" \
            --ignore-not-found

          kubectl create secret generic app-secrets \
            --namespace "$NAMESPACE" \
            --from-literal=APP_KEY="$APP_KEY" \
            --from-literal=DB_PASSWORD="$DB_PASSWORD" \
            --from-literal=JWT_SECRET="$JWT_SECRET" \
            --from-literal=MAIL_USERNAME="$MAIL_USERNAME" \
            --from-literal=MAIL_PASSWORD="$MAIL_PASSWORD" \
            --from-literal=NEW_RELIC_LICENSE_KEY="$NEW_RELIC_LICENSE_KEY" \
            --from-literal=NEW_RELIC_KEY="$NEW_RELIC_KEY" \
            --from-literal=NEW_RELIC_API_KEY="$NEW_RELIC_API_KEY" \
            --from-literal=NEW_RELIC_ACCOUNT_ID="$NEW_RELIC_ACCOUNT_ID" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      # ---------------------------------------------------------
      # DATABASE MIGRATION
      # ---------------------------------------------------------
      - name: Run database migrations
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          echo "Running migration with:"
          echo "${APP_IMAGE}:${IMAGE_TAG}"

          kubectl delete job app-migrate \
            -n "$NAMESPACE" \
            --ignore-not-found

          yq eval \
            '.spec.template.spec.containers[0].image = env(APP_IMAGE) + ":" + env(IMAGE_TAG)' \
            k8s/02-app/migrate-job.yaml \
            > /tmp/migrate-job.yaml

          kubectl apply -f /tmp/migrate-job.yaml

          echo "Waiting for migration..."

          if ! kubectl wait \
            --for=condition=complete \
            job/app-migrate \
            -n "$NAMESPACE" \
            --timeout=180s; then

            echo "Migration failed."

            kubectl describe job app-migrate \
              -n "$NAMESPACE" || true

            echo "Migration logs:"

            kubectl logs \
              job/app-migrate \
              -n "$NAMESPACE" \
              --tail=200 || true

            exit 1
          fi

          echo "Migration completed successfully."

          kubectl logs \
            job/app-migrate \
            -n "$NAMESPACE" \
            --tail=200

      # ---------------------------------------------------------
      # APPLICATION
      # ---------------------------------------------------------
      - name: Apply Application
        run: |
          kubectl apply -f k8s/02-app

      # ---------------------------------------------------------
      # NEW RELIC
      # ---------------------------------------------------------
      - name: Deploy New Relic Kubernetes integration
        run: |
          set -euo pipefail

          helm repo add newrelic https://helm-charts.newrelic.com || true
          helm repo update

          helm upgrade --install newrelic-bundle \
            newrelic/nri-bundle \
            --namespace "$NAMESPACE" \
            -f newrelic-values.yaml

      # ---------------------------------------------------------
      # ROLLOUT
      # ---------------------------------------------------------
      - name: Rollout deployment
        run: |
          kubectl rollout restart \
            deployment/postech-app \
            -n "$NAMESPACE"

      - name: Rollout status
        run: |
          kubectl rollout status \
            deployment/postech-app \
            -n "$NAMESPACE" \
            --timeout=180s

      # ---------------------------------------------------------
      # SHOW PODS
      # ---------------------------------------------------------
      - name: Show pods
        run: |
          kubectl get pods \
            -n "$NAMESPACE" \
            -o wide

      - name: Show deployment image
        run: |
          kubectl get deployment postech-app \
            -n "$NAMESPACE" \
            -o jsonpath='{.spec.template.spec.containers[*].image}'

          echo