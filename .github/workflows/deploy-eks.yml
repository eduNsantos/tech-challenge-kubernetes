name: Deploy to EKS

on:
  repository_dispatch:
    types: [deploy-eks]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy'
        required: false
        default: 'latest'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: us-east-1
      EKS_CLUSTER_NAME: main
      NAMESPACE: postech
      APP_IMAGE: ghcr.io/edunsantos/tech-challenge-application

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image tag
        id: image
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "tag=${{ github.event.client_payload.tag || 'latest' }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.inputs.image_tag || 'latest' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig for EKS
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"

      - name: Apply non-secret Kubernetes config
        run: |
          kubectl apply -f k8s/00-namespaces/
          kubectl apply -f k8s/01-config/configmap.yaml

      - name: Create GHCR pull secret if needed
        run: |
          kubectl create secret docker-registry ghcr-secret \
            --docker-server=ghcr.io \
            --docker-username=${{ secrets.GHCR_USERNAME }} \
            --docker-password=${{ secrets.GHCR_TOKEN }} \
            --docker-email=${{ secrets.GHCR_EMAIL }} \
            --namespace "$NAMESPACE" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create app secret from GitHub repository secrets
        run: |
          kubectl delete secret ghcr-secret \
            -n postech \
            --ignore-not-found

          kubectl create secret generic ghcr-secret \
            --namespace "$NAMESPACE" \
            --from-literal=APP_KEY="${{ secrets.APP_KEY }}" \
            --from-literal=DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            --from-literal=JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            --from-literal=MAIL_USERNAME="${{ secrets.MAIL_USERNAME }}" \
            --from-literal=MAIL_PASSWORD="${{ secrets.MAIL_PASSWORD }}" \
            --from-literal=NEW_RELIC_LICENSE_KEY="${{ secrets.NEW_RELIC_LICENSE_KEY }}" \
            --from-literal=NEW_RELIC_KEY="${{ secrets.NEW_RELIC_KEY }}" \
            --from-literal=NEW_RELIC_API_KEY="${{ secrets.NEW_RELIC_API_KEY }}" \
            --from-literal=NEW_RELIC_ACCOUNT_ID="${{ secrets.NEW_RELIC_ACCOUNT_ID }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Run database migrations
        run: |
          kubectl delete job app-migrate -n "$NAMESPACE" --ignore-not-found
          yq eval '.spec.template.spec.containers[0].image = "'"${APP_IMAGE}:${{ steps.image.outputs.tag }}"'"' \
            -i k8s/02-app/migrate-job.yaml
          kubectl apply -f k8s/02-app/migrate-job.yaml
          kubectl wait --for=condition=complete job/app-migrate -n "$NAMESPACE" --timeout=180s || {
            echo "Migration did not complete in time — dumping logs:";
            kubectl logs job/app-migrate -n "$NAMESPACE" --tail=100 || true;
            exit 1;
          }

      - name: Update deployment image
        run: |
          kubectl -n "$NAMESPACE" set image deployment/postech-app app=${APP_IMAGE}:${{ steps.image.outputs.tag }}

      - name: Trigger rollout
        run: |
          kubectl -n "$NAMESPACE" rollout restart deployment/postech-app

      - name: Rollout status
        run: |
          kubectl -n "$NAMESPACE" rollout status deployment/postech-app --timeout=180s

      - name: Show pods
        run: kubectl -n "$NAMESPACE" get pods
