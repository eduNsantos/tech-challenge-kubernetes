apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: postech
data:
  APP_NAME: "POS Tech"
  APP_ENV: "production"
  APP_DEBUG: "true"
  LOG_CHANNEL: "stack"
  LOG_STACK: "single,json"
  # APP_URL, DB_HOST e PAYMENT_SERVICE_URL são resolvidos no deploy:
  # - APP_URL: hostname do ELB do Service postech-app
  # - DB_HOST: endpoint do RDS MySQL
  # - PAYMENT_SERVICE_URL: API Gateway "payment-service-api"
  # Os valores abaixo são placeholders substituídos durante deploy
  APP_URL: "<APP_URL>"
  PAYMENT_SERVICE_URL: "<PAYMENT_SERVICE_URL>"
  PAYMENT_SERVICE_TIMEOUT: "5"
  APP_LOCALE: "pt_BR"
  APP_FALLBACK_LOCALE: "en"
  APP_FAKER_LOCALE: "pt_BR"
  APP_MAINTENANCE_DRIVER: "file"
  DB_CONNECTION: "mysql"
  DB_HOST: "<DB_HOST>"
  DB_PORT: "3306"
  DB_DATABASE: "techchallenge"
  DB_USERNAME: "root"
  AWS_DEFAULT_REGION: "us-east-1"
  SERVICES_MS_ENABLED: "<SERVICES_MS_ENABLED>"
  SQS_SERVICE_ORDERS_CREATED_URL: "<SQS_SERVICE_ORDERS_CREATED_URL>"
  SQS_SERVICE_ORDER_STATUS_CHANGED_URL: "<SQS_SERVICE_ORDER_STATUS_CHANGED_URL>"
  SQS_SERVICE_ORDER_EXECUTION_URL: "<SQS_SERVICE_ORDER_EXECUTION_URL>"
  QUEUE_CONNECTION: "database"
  CACHE_STORE: "database"
  MAIL_MAILER: "log"
  MAIL_HOST: "smtp.gmail.com"
  MAIL_PORT: "587"
  MAIL_FROM_ADDRESS: "evdwsoat15@gmail.com"
  MAIL_FROM_NAME: "POS Tech"
  NEW_RELIC_APP_NAME: "Tech Challenge POS"
  NEW_RELIC_ENABLED: "true"
  NEW_RELIC_DAEMON_ADDRESS: "newrelic:31339"