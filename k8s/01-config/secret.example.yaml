apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: postech
type: Opaque
# Todos os valores devem ser codificados em base64.
# Para gerar: echo -n "valor" | base64
# Para o APP_KEY, use: php artisan key:generate --show | base64
# Para o JWT_SECRET, use: php artisan jwt:secret --show | base64
stringData:
  APP_KEY: "base64:ALTERE_PARA_APP_KEY_REAL"
  DB_PASSWORD: "ALTERE_PARA_SENHA_DO_RDS"
  JWT_SECRET: "ALTERE_PARA_JWT_SECRET_REAL"
  MAIL_USERNAME: "seu-email@exemplo.com"
  MAIL_PASSWORD: "sua-senha-de-email"