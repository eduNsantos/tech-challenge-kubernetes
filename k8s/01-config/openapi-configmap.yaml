apiVersion: v1
kind: ConfigMap
metadata:
  name: openapi-spec
  namespace: postech
data:
  openapi.yaml: |
    openapi: 3.0.3

    info:
      title: TechChallenge API
      description: |-
        Documentação da API do TechChallenge.

        ## Autenticação

        A API utiliza **JWT (JSON Web Token)** para autenticação.

        Para acessar endpoints protegidos:
        1. Crie uma conta via `POST /auth/register`
        2. Autentique-se via `POST /auth/login` e obtenha o `access_token`
        3. Envie o token no cabeçalho de todas as requisições protegidas:
           ```
           Authorization: Bearer {access_token}
           ```
      version: 1.3.0
      contact: {}

    servers:
      - url: http://localhost:8080/api
        description: Servidor local de desenvolvimento

    tags:
      - name: Autenticação
        description: Operações de registro, login, logout e gerenciamento de sessão JWT
      - name: Veículos
        description: Operações de gerenciamento de veículos (requer autenticação)
      - name: Peças e Insumos
        description: Cadastro e gestão de peças e insumos do almoxarifado (requer autenticação)
      - name: Estoque
        description: Controle de movimentações de estoque — entradas, saídas e histórico (requer autenticação)
      - name: Serviços
        description: Operações de gerenciamento de serviços (requer autenticação)
      - name: Ordens de Serviço
        description: >
          Operação principal do sistema — abre, acompanha e encerra o atendimento de um veículo.
          Fluxo de status: recebida → em_diagnostico → aguardando_aprovacao → em_execucao → finalizada → entregue.
          A aprovação do orçamento dispara a baixa automática de estoque das peças (requer autenticação)
      - name: Serviços de Ordem
        description: Controle de execução individual de serviços dentro de uma OS — iniciar e finalizar (requer autenticação)
      - name: Clientes
        description: Operações de gerenciamento de clientes (requer autenticação)
      - name: Notificações
        description: Consulta de notificações enviadas aos clientes (requer autenticação)

    paths: {}