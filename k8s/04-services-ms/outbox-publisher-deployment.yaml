apiVersion: apps/v1
kind: Deployment
metadata:
  name: postech-outbox-publisher
  namespace: postech
  labels:
    app: postech-outbox-publisher
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postech-outbox-publisher
  template:
    metadata:
      labels:
        app: postech-outbox-publisher
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: outbox-publisher
          image: ghcr.io/edunsantos/tech-challenge-application:latest
          imagePullPolicy: Always
          command: ["php", "artisan", "outbox:publish"]
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
