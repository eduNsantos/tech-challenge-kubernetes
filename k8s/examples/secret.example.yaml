apiVersion: v1
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: postech
type: Opaque
# stringData recebe valores em texto; nao codifique os valores novamente.
# Nao versione o arquivo preenchido nem compartilhe seus valores.
stringData:
  APP_KEY: "base64:ALTERE_PARA_APP_KEY_REAL"
  DB_PASSWORD: "ALTERE_PARA_SENHA_DO_RDS"
  JWT_SECRET: "ALTERE_PARA_JWT_SECRET_REAL"
  MAIL_USERNAME: "seu-email@exemplo.com"
  MAIL_PASSWORD: "sua-senha-de-email"