apiVersion: apps/v1
kind: Deployment
metadata:
  name: postech-app
  namespace: postech
  labels:
    app: postech-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: postech-app
  template:
    metadata:
      labels:
        app: postech-app
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z mysql 3306; do
                echo "aguardando MySQL...";
                sleep 3;
              done;
              echo "MySQL disponivel."
      containers:
        - name: app
          image: ghcr.io/edunsantos/tech-challenge:latest
          imagePullPolicy: Always
          command:
            - php
            - artisan
            - serve
            - --host=0.0.0.0
            - --port=8000
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
          livenessProbe:
            httpGet:
              path: /up
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /up
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"