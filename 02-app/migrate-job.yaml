apiVersion: batch/v1
kind: Job
metadata:
  name: app-migrate
  namespace: postech
  labels:
    app: postech-app
    component: migrate
spec:
  backoffLimit: 3
  template:
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z mysql 3306; do
                echo "aguardando MySQL...";
                sleep 3;
              done;
              echo "MySQL disponivel."
      containers:
        - name: migrate
          image: ghcr.io/edunsantos/tech-challenge-1:latest
          imagePullPolicy: Always
          command:
            - php
            - artisan
            - migrate
            - --force
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "200m"
              memory: "512Mi"