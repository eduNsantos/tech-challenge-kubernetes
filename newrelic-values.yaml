global:
  cluster: postech-k8s

  customSecretName: app-secrets
  customSecretLicenseKey: NEW_RELIC_LICENSE_KEY

  lowDataMode: false

newrelic-infrastructure:
  enabled: true
  privileged: true

newrelic-logging:
  enabled: true

nri-metadata-injection:
  enabled: true

nri-kube-events:
  enabled: true

kube-state-metrics:
  enabled: true

nri-prometheus:
  enabled: false

newrelic-pixie:
  enabled: false

nr-ebpf-agent:
  enabled: false

k8s-agents-operator:
  enabled: false